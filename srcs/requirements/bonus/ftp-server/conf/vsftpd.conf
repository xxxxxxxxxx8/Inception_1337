anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
xferlog_enable=YES
connect_from_port_20=YES
xferlog_std_format=YES
chroot_local_user=YES
allow_writeable_chroot=YES
listen=YES
listen_port=21
listen_address=0.0.0.0
listen_ipv6=NO

seccomp_sandbox=NO
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_address=127.0.0.1

ssl_enable=NO

pam_service_name=vsftpd
userlist_enable=NO
check_shell=NO

log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log

use_localtime=YES
max_clients=10
max_per_ip=2
